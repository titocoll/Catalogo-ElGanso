name: Actualizar feed El Ganso

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node generar-elganso.mjs
      - if: hashFiles('publicar/elganso.xml') != ''
        uses: actions/configure-pages@v5
      - if: hashFiles('publicar/elganso.xml') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: publicar
      - if: hashFiles('publicar/elganso.xml') != ''
        id: deployment
        uses: actions/deploy-pages@v4
